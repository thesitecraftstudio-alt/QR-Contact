<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach Out | Digital Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background shapes for the glass effect to reflect -->
    <div class="background-animation">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
    </div>

    <!-- Main Glassmorphism Card -->
    <main class="glass-card">
        <!-- Floating Mascot Profile -->
        <div class="mascot-container">
            <svg viewBox="0 0 100 100" class="mascot" xmlns="http://www.w3.org/2000/svg">
                <!-- Mascot Face -->
                <circle cx="50" cy="60" r="18" fill="#fcd0b4"/> 
                <!-- Beard -->
                <path d="M 32 60 C 32 85, 68 85, 68 60 C 60 75, 40 75, 32 60" fill="#2d3748"/>
                <!-- Eyes -->
                <circle cx="43" cy="56" r="2.5" fill="#1a202c"/>
                <circle cx="57" cy="56" r="2.5" fill="#1a202c"/>
                <!-- Smile -->
                <path d="M 45 65 Q 50 69 55 65" stroke="#1a202c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <!-- Turban (Dumalla/Patiala style wrap) -->
                <path d="M 22 42 C 22 15, 78 15, 78 42 C 84 48, 75 58, 65 52 C 55 62, 45 62, 35 52 C 25 58, 16 48, 22 42 Z" fill="#6366f1"/>
                <path d="M 28 35 Q 50 48 72 35" stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 35 25 Q 50 38 65 25" stroke="#4f46e5" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
        </div>
        
        <!-- Details & Actions -->
        <div class="content">
            <h1 class="name">The Site Craft Studio</h1>
            <p class="title">Custom Development and Consultancy</p>
            
            <div class="actions">
                <!-- Replace 'contact.vcf' with the actual name of your vCard file -->
                <a href="./the-site-craft-studio.vcf" class="btn primary-btn">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Save Contact
                </a>
                <a href="mailto:bawabalwant045@gmail.com" class="btn glass-btn">Send an Email</a>
                <a href="https://linkedin.com/in/yourprofile" target="_blank" class="btn glass-btn">Connect on LinkedIn</a>
            </div>
        </div>
    </main>
</body>
</html>
